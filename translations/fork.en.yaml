admin:
    fork_projektakte:
        heading: "Projektakte"
        reachable: "reachable"
        unreachable: "not reachable"
        intro: "plMail sends Projektakte only the mail a person filed under a project while reading it — as .eml with its attachments. When the assignment is changed, taken off, set to \"Not about a project\", or the mail is deleted for good, Projektakte is told as well. Everything goes into a queue first and is delivered in the background; while Projektakte cannot be reached, plMail tries again later (1 minute, growing to 1 hour apart)."
        waiting: "Waiting in the queue"
        last_error: "Last error"
        no_error: "none"
        error_mail: "mail %id%"
        retrying: "Being retried (%attempts% times so far, next at %next%): %error%"
        resend: "Send all filed mail to Projektakte"
        resend_help: "For the start and after an outage. Each filed mail is queued exactly once."
        resend_progress: "Resend of %at%: %done% of %total% delivered …"
        resend_done: "Resend of %at%: all %total% delivered."
    ai:
        field:
            reasoning: 'Let the writing model reason'
            reasoning_help: 'Off asks the model to answer straight away instead of thinking first: quicker replies, sorting and summaries, usually a little less careful. Sent as think: false to Ollama and as chat_template_kwargs.enable_thinking: false to an OpenAI-compatible server (vLLM, SGLang, llama.cpp). A hosted API that does not know the field may refuse the request.'
            rerank_url: "Search reranker (address)"
            rerank_url_help: "Full address of a /rerank endpoint (Cohere/Jina shape, e.g. Qwen3-Reranker). Orders the results for \"Best matches\" and \"In short\" by how well they fit the search; the results list itself stays as it is. Empty: FORK_RERANK_URL applies, otherwise no reranker. \"Test\" sends a small probe."
        fork_rerank:
            ok: "Reranker answered in %ms% ms (match %match%, miss %miss%)."
            failed: "The reranker did not answer as expected: %error%"
